services:
  master:
    build: .
    ports:
     - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master --expect-workers 5 -H https://mandarin.nicols.uk/composerdemo
    extra_hosts:
      - "host.docker.internal:host-gateway" # Ensures resolution works correctly

  worker1:
    build: .
    volumes:
      - ./:/mnt/locust
    environment:
      - LOCUST_WORKER_INDEX=0
      - LOCUST_WORKER_COUNT=5
    command: -f /mnt/locust/locustfile.py --worker --master-host master
    extra_hosts:
      - "mandarin.nicols.uk:host-gateway" # Ensures resolution works correctly
  worker2:
    build: .
    volumes:
      - ./:/mnt/locust
    environment:
